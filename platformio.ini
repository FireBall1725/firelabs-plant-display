; FireLabs Plant Display
; Waveshare ESP32-S3-Touch-LCD-4.3: 800x480 RGB panel, GT911 touch, CH422G IO expander
; ESP32-S3 rev v0.2, 8 MB quad flash, 8 MB octal PSRAM, CH343 USB-UART on the "UART" port

[platformio]
name = firelabs-plant-display
default_envs = pd

[env:pd]
; pioarduino, pinned: stock PlatformIO's espressif32 can't do custom_sdkconfig or core 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; the CH343 on macOS's built-in driver drops large writes, so esptool gets small packets
extra_scripts =
    scripts/small_packet_upload.py
    scripts/gdma_iram_ld.py

; A 64 KB data cache with 64-byte lines (stock is 32 KB / 32 B). The panel is refilled
; from the PSRAM frame buffer by CPU memcpy in an ISR, and with wifi also using PSRAM
; those copies sometimes overran the ~1.2 ms a bounce buffer lasts (worst 1.74 ms), which
; showed as the whole screen blinking. Wider lines roughly double what each PSRAM fetch
; brings in. pioarduino rebuilds the framework libs for this; the rebuild starts from the
; generic S3 config, so the other lines restate stock Arduino qio_opi values that drift
; otherwise. Do NOT add CONFIG_SPIRAM_XIP_FROM_PSRAM: it broke TCP on the setup AP.
custom_sdkconfig =
    ; LCD_RGB_RESTART_IN_VSYNC restarts the GDMA from the vsync ISR, which also runs
    ; during flash writes (IRAM-safe). The GDMA control functions are only placed in
    ; IRAM with this; without it every OTA (and any flash write that lands on a vsync)
    ; panics "Cache disabled but cached memory region accessed" in
    ; gdma_ahb_hal_get_intr_status_reg. Stock Arduino libs have the same gap.
    ; The hybrid rebuild doesn't regenerate sections.ld, so ldgen-only placements
    ; (this one included) are ignored: scripts/gdma_iram_ld.py adds them by hand.
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_32KB=n
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_32B=n
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_MODE_QUAD=n
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
    CONFIG_ESPTOOLPY_FLASHSIZE_16MB=n
    CONFIG_ESPTOOLPY_FLASHSIZE="8MB"
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_TX_BUFFER_TYPE=1
    CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM=32
    CONFIG_ESP32_WIFI_STATIC_TX_BUFFER=n
    CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER=y
    CONFIG_ESP_WIFI_RX_BA_WIN=6
    CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS=4
; Cloud, Zigbee, speech and modem components the rebuilt framework would otherwise pull
; in; esp_insights also breaks the build (embeds a missing https_server.crt).
custom_component_remove =
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_schedule
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-sr
    espressif/esp_modem
    espressif/esp-modbus
    espressif/esp_rcp_update
    chmorgan/esp-libhelix-mp3

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0   ; logs go out UART0 through the CH343
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lvgl/lvgl @ ^9.2.2
    bblanchon/ArduinoJson @ ^7.2.0
    ; Pinned to a tag so a firmware release always builds the same core. For local
    ; work on the core, swap in symlink://../firelabs-core (a lib/ copy does NOT win
    ; over lib_deps).
    https://github.com/FireBall1725/firelabs-core.git#v0.2.0

; Bench build: request logging, heartbeat, /api/debug and the debug routes
; (test plants, update-screen preview, flash test, LVGL heap switch).
[env:pd-debug]
extends = env:pd
build_flags =
    ${env:pd.build_flags}
    -DFL_DEBUG_PORTAL

; Same firmware with a fixed bundle and no wifi, for checking the screens on the panel.
[env:demo]
extends = env:pd
build_flags =
    ${env:pd.build_flags}
    -DFL_DEMO
